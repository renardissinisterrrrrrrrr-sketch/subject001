<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Character Folder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="folder">

        <!-- Folder tab -->
        <div class="folder-tab">
            ROBLOXIANS
        </div>


        <!-- Small decorative photo on folder -->
        <div class="folder-photo">
            <div class="tape"></div>

            <!-- CHANGE THIS IMAGE -->
            <img src="https://files.catbox.moe/q8dc54.png" alt="Oakley">
        </div>


        <!-- Main folder contents -->
        <div class="folder-paper">

            <div class="paper-header">
                <span>RECORDS</span>
                <span>FILE 001</span>
            </div>


            <div class="profile">

                <!-- Profile picture -->
                <div class="profile-picture">

                    <!-- CHANGE THIS IMAGE -->
                    <img src="https://files.catbox.moe/itsu40.png" alt="Oakley">

                </div>


                <!-- Character information -->
                <div class="profile-info">

                    <h1>AEACUS SKYWING</h1>


                    <div class="info-grid">

                        <div class="info-item">
                            <span class="label">Age</span>
                            <span class="value">27</span>
                        </div>

                        <div class="info-item">
                            <span class="label">Sex</span>
                            <span class="value">INTERFEMALE</span>
                        </div>

                        <div class="info-item">
                            <span class="label">Gender</span>
                            <span class="value">"BIGENDER"</span>
                        </div>

                        <div class="info-item">
                            <span class="label">Status</span>
                            <span class="value">ALIVE</span>
                        </div>

                        <div class="info-item">
                            <span class="label">Role</span>
                            <span class="value">FORMER ADMIN</span>
                        </div>
                        
                    </div>

                </div>

            </div>

        </div>

      </main>

    <script src="index.js"></script>

</body>
</html>
